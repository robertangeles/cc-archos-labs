name: Eval — Recommended Readings (nightly)

# Runs the ANN retrieval + gloss eval benches once per day against the
# prod DB via a read-only Postgres role. Fails visibly when bench
# assertions regress — i.e. when retrieval drift, embedding-model drift,
# or post-content churn causes a curated case to no longer surface its
# expected post in the top-3 (or the gloss output stops obeying the
# tone constraints).
#
# Why nightly, not per-PR (eng review E7):
#   - eval needs the real post.embedding column populated against the
#     full 253-post corpus; spinning up a seeded test DB per CI run is
#     ~3-5min and meaningful $$ for the embed cost
#   - retrieval-touching PRs are rare (~weekly at this stage)
#   - manual `pnpm test:eval` is the per-PR gate documented in
#     CONTRIBUTING.md — developer runs it locally before merging any
#     PR that touches lib/posts/find-similar.ts,
#     lib/diagnostic/recommend.ts, lib/posts/gloss.ts, or
#     lib/embeddings.ts

on:
  schedule:
    # 09:00 UTC daily. Off-peak for prod traffic, gives us a fresh
    # bench result before the working day starts.
    - cron: "0 9 * * *"
  # Manual trigger from the Actions tab so we can re-run after fixing
  # an alert without waiting until tomorrow.
  workflow_dispatch:

concurrency:
  group: eval-nightly
  cancel-in-progress: false

jobs:
  eval:
    name: ANN retrieval + gloss eval
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run eval suite
        env:
          # Read-only Postgres role — SELECT-only on post,
          # report_output. Set in repo secrets. Separate from the
          # main DATABASE_URL so a credential leak in the workflow
          # can't mutate prod data.
          DATABASE_URL: ${{ secrets.DATABASE_URL_READONLY }}
          # OpenRouter key used by lib/embeddings.ts and
          # lib/posts/gloss.ts. Same key as prod but the eval calls
          # are bounded (~$0.02 per run, ~$7/year).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_EVAL }}
        # Uses the existing vitest.eval.config.ts which already
        # globs tests/eval/**/*.eval.test.ts (incl. our new
        # recommend + gloss benches). Matches the booking-side
        # eval pattern.
        run: pnpm eval

      # On failure, the next step would post to Slack / open a GH
      # issue. Wiring that requires the SLACK_WEBHOOK_URL or PAT
      # secret to be set; for v1 the failed Actions run is the alert
      # surface (visible in the repo Actions tab + email if the
      # repo notification setting is on).
